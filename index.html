<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#1a1a2e">
<title>PsiGestão</title>

<style>
:root{--bg:#0f0f1a;--bg2:#1a1a2e;--bg3:#252540;--bg4:#2a2a48;--text:#e0e0f0;--text2:#9090b0;--accent:#7c6ff7;--accent2:#5a4fcf;--green:#4ade80;--red:#f87171;--amber:#fbbf24;--blue:#60a5fa;--radius:12px;--r2:8px;--shadow:0 4px 24px rgba(0,0,0,.3);--font:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;--aside:230px;--head:56px}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;overflow:hidden}
button{cursor:pointer;font-family:var(--font);border:none;background:none;color:inherit}
input,textarea,select{font-family:var(--font);font-size:14px;background:var(--bg3);border:1px solid var(--bg4);color:var(--text);border-radius:var(--r2);padding:10px 14px;outline:none;width:100%;transition:border .2s}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:60px}
select{appearance:auto}
button.primary{background:var(--accent);color:#fff;padding:10px 20px;border-radius:var(--r2);font-weight:600;transition:background .2s}
button.primary:hover{background:var(--accent2)}
button.sm{padding:6px 12px;font-size:13px}
button.outline{background:transparent;border:1px solid var(--bg4);color:var(--text2);padding:8px 16px;border-radius:var(--r2);transition:.2s}
button.outline:hover{border-color:var(--accent);color:var(--text)}
.btn-icon{width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;border-radius:var(--r2);transition:.15s;font-size:18px}
.btn-icon:hover{background:var(--bg3)}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600}
.badge-green{background:rgba(74,222,128,.15);color:var(--green)}
.badge-red{background:rgba(248,113,113,.15);color:var(--red)}
.badge-amber{background:rgba(251,191,36,.15);color:var(--amber)}
.badge-blue{background:rgba(96,165,250,.15);color:var(--blue)}

/* Login */
#login{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--bg),var(--bg2))}
.login-b{background:var(--bg2);padding:40px;border-radius:var(--radius);box-shadow:var(--shadow);width:360px;max-width:90vw;text-align:center}
.login-b h1{font-size:24px;margin-bottom:4px}
.login-b p{color:var(--text2);font-size:13px;margin-bottom:24px}
.login-b input{padding:12px 16px;font-size:16px;margin-bottom:8px}
.login-b button{width:100%;padding:12px;margin-top:4px;background:var(--accent);color:#fff;border:none;border-radius:var(--r2);font-size:16px;font-weight:600}
.login-b button:hover{background:var(--accent2)}
.login-e{color:var(--red);font-size:13px;margin-top:8px;display:none}
.lock{font-size:48px;margin-bottom:16px}

/* Layout */
#app{display:flex;height:100vh;display:none}
.aside{width:var(--aside);background:var(--bg2);display:flex;flex-direction:column;border-right:1px solid var(--bg3);flex-shrink:0}
.brand{padding:16px 20px;font-size:17px;font-weight:700;border-bottom:1px solid var(--bg3)}
.brand span{color:var(--accent)}
.nav{flex:1;padding:8px}
.nav-i{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:var(--r2);color:var(--text2);font-size:13px;font-weight:500;transition:.15s;cursor:pointer;width:100%;text-align:left}
.nav-i:hover{background:var(--bg3);color:var(--text)}
.nav-i.act{background:var(--accent);color:#fff}
.ni-ic{font-size:16px;width:22px;text-align:center}
.aside-f{padding:12px 16px;border-top:1px solid var(--bg3)}
.aside-f button{width:100%;padding:8px;border:1px solid var(--bg3);color:var(--text2);border-radius:var(--r2);font-size:12px;transition:.2s}
.aside-f button:hover{border-color:var(--red);color:var(--red)}

/* Main */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.mh{height:var(--head);display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid var(--bg3);flex-shrink:0}
.mh h2{font-size:18px;font-weight:600}
.mh-actions{display:flex;gap:8px;align-items:center}
#content{flex:1;overflow-y:auto;padding:20px 24px}

/* Cards */
.card{background:var(--bg2);border-radius:var(--radius);padding:16px;margin-bottom:12px;border:1px solid var(--bg3)}
.card-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.card-h h3{font-size:15px;font-weight:600}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px}
.stat-c{background:var(--bg2);border-radius:var(--radius);padding:16px;border:1px solid var(--bg3);text-align:center}
.stat-v{font-size:28px;font-weight:700;margin-top:4px}
.stat-l{color:var(--text2);font-size:12px;text-transform:uppercase;letter-spacing:.5px}

/* Table */
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:10px 12px;color:var(--text2);font-weight:500;border-bottom:1px solid var(--bg3);font-size:12px;text-transform:uppercase;letter-spacing:.5px}
td{padding:10px 12px;border-bottom:1px solid var(--bg3)}
tr:hover td{background:var(--bg3)}

/* Agenda grid */
.ag-grid{display:grid;grid-template-columns:70px repeat(5,1fr);gap:2px;min-height:600px}
.ag-time{display:flex;align-items:start;justify-content:center;padding-top:4px;font-size:11px;color:var(--text2);position:relative}
.ag-time::after{content:'';position:absolute;top:50%;left:70px;right:0;height:1px;background:var(--bg3);pointer-events:none}
.ag-col{min-height:600px;position:relative;background:var(--bg2);border-radius:4px}
.ag-col.h{background:var(--bg3)}
.ag-slot{position:absolute;left:2px;right:2px;border-radius:6px;padding:4px 6px;font-size:11px;overflow:hidden;cursor:pointer;transition:.15s;border:1px solid transparent}
.ag-slot:hover{border-color:var(--accent);transform:scale(1.02);z-index:2}
.ag-slot.confirmed{background:rgba(74,222,128,.2);color:var(--green)}
.ag-slot.cancelled{background:rgba(248,113,113,.15);color:var(--red)}
.ag-slot.pending{background:rgba(251,191,36,.15);color:var(--amber)}
.ag-slot .name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ag-slot .time{opacity:.7}
.ag-empty{display:flex;align-items:center;justify-content:center;height:100%;color:var(--text2);font-size:12px;font-style:italic}
.ag-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.ag-header h3{font-size:15px;font-weight:600}
.ag-nav{display:flex;gap:6px;align-items:center}

/* Modal */
.modal-o{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center}
.modal-o.show{display:flex}
.modal{background:var(--bg2);border-radius:var(--radius);padding:24px;width:520px;max-width:95vw;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow)}
.modal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.modal-h h3{font-size:17px;font-weight:600}
.form-g{margin-bottom:14px}
.form-g label{display:block;font-size:13px;color:var(--text2);margin-bottom:4px;font-weight:500}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;padding-top:12px;border-top:1px solid var(--bg3)}
.btn-ghost{color:var(--text2);padding:8px 16px;border-radius:var(--r2);transition:.15s}
.btn-ghost:hover{background:var(--bg3);color:var(--text)}

/* Search */
.search-b{display:flex;gap:8px;margin-bottom:12px}
.search-b input{flex:1}
.search-b input[type=search]{max-width:300px}

/* Tabs inside */
.sub-tabs{display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--bg3);padding-bottom:4px}
.sub-tab{padding:8px 16px;font-size:13px;color:var(--text2);border-radius:var(--r2) var(--r2) 0 0;transition:.15s;cursor:pointer}
.sub-tab:hover{color:var(--text);background:var(--bg3)}
.sub-tab.act{color:var(--text);background:var(--bg3);font-weight:600}

/* Booking link */
.bl-card{background:var(--bg2);border:1px solid var(--bg3);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.bl-card .bl-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.bl-card .bl-h h4{font-size:15px}
.bl-card .bl-url{background:var(--bg3);padding:8px 12px;border-radius:var(--r2);font-size:12px;color:var(--text2);word-break:break-all;margin:8px 0;display:flex;align-items:center;gap:8px}
.bl-card .bl-url code{flex:1;font-size:12px}
.bl-tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;margin-right:4px;background:var(--bg4)}

/* Hamburger */
.hamb{display:none;width:36px;height:36px;align-items:center;justify-content:center;border-radius:var(--r2);font-size:22px;cursor:pointer;transition:.15s;flex-shrink:0}
.hamb:hover{background:var(--bg3)}

/* Sidebar overlay */
.sb-overlay{position:fixed;inset:0;z-index:89;background:rgba(0,0,0,.5);display:none}

/* Responsive */
@media(max-width:768px){
  .hamb{display:flex}
  .aside{position:fixed;top:0;left:0;bottom:0;z-index:90;width:280px;transform:translateX(-100%);transition:transform .25s;box-shadow:var(--shadow)}
  .aside.open{transform:translateX(0)}
  .sb-overlay.show{display:block}
  .ag-grid{grid-template-columns:50px repeat(5,1fr);font-size:10px}
  .mh h2{font-size:15px}
  .form-row{grid-template-columns:1fr}
  .stat-grid{grid-template-columns:repeat(2,1fr)}
}

/* Toast */
.toast{position:fixed;bottom:24px;right:24px;background:var(--bg2);border:1px solid var(--bg3);border-radius:var(--radius);padding:12px 20px;box-shadow:var(--shadow);z-index:200;animation:slideIn .3s;font-size:14px;max-width:360px}
.toast.ok{border-color:var(--green)}
.toast.err{border-color:var(--red)}
@keyframes slideIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

/* Patient card mini */
.pc{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--bg3)}
.pc:last-child{border:none}
.pc-av{width:40px;height:40px;border-radius:50%;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.pc-info{flex:1}
.pc-info .name{font-weight:600;font-size:14px}
.pc-info .meta{font-size:12px;color:var(--text2)}
.pc-actions{display:flex;gap:4px;flex-shrink:0}

/* Pill tabs */
.pill-group{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px}
.pill{padding:6px 14px;border-radius:99px;font-size:12px;background:var(--bg3);color:var(--text2);cursor:pointer;transition:.15s}
.pill.act{background:var(--accent);color:#fff}
.pill:hover{background:var(--bg4)}

/* Mini modal for templates */
.temp-list{display:grid;gap:6px;margin-bottom:12px}
.temp-item{padding:8px 12px;background:var(--bg3);border-radius:var(--r2);cursor:pointer;font-size:13px;transition:.15s}
.temp-item:hover{background:var(--bg4);color:var(--accent)}

/* Settings groups */
.set-g{margin-bottom:16px}
.set-g h4{font-size:14px;font-weight:600;margin-bottom:8px;color:var(--text)}
.set-g .hint{font-size:12px;color:var(--text2);margin-top:4px}

/* Loading */
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--bg4);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* WhatsApp green */
.whatsapp{color:#25D366}
.whatsapp:hover{background:rgba(37,211,102,.1)}
.gcal{color:#4285F4}
.gcal:hover{background:rgba(66,133,244,.1)}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <div class="login-b">
    <div class="lock">🔒</div>
    <h1>PsiGestão</h1><p>Agenda inteligente para psicólogos</p>
    <input type="password" id="pw" placeholder="Senha" autocomplete="off" onkeydown="if(event.key==='Enter')tryLogin()">
    <button onclick="tryLogin()">Entrar</button>
    <div class="login-e" id="loginE">Senha incorreta</div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <aside class="aside" id="aside">
    <div class="brand">Psi<span>Gestão</span></div>
    <nav class="nav" id="nav"></nav>
    <div class="aside-f"><button onclick="logout()">🚪 <span>Sair</span></button></div>
  </aside>
  <div class="sb-overlay" id="sbOverlay" onclick="closeSidebar()"></div>
  <div class="main">
    <div class="mh" id="mh"><button class="hamb" id="hamb" onclick="toggleSidebar()">☰</button><h2 id="mhTitle">Agenda</h2><div class="mh-actions" id="mhActions"></div></div>
    <div id="content"></div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-o" id="modalO"><div class="modal" id="modal"></div></div>

<script>
// ==============================
// STATE
// ==============================
const S={patients:[],appointments:[],settings:{},bookingLinks:[]};
const LS=k=>JSON.parse(localStorage.getItem('psi_'+k)||'null');
const LSS=(k,v)=>localStorage.setItem('psi_'+k,JSON.stringify(v));
let curTab='agenda',curWeek=0;

function loadState(){
  S.patients=LS('patients')||[];
  S.appointments=LS('appointments')||[];
  S.settings=LS('settings')||{sessionValue:150,duration:50,name:'Dr(a)',whatsapp:'',notify:true,msgConfirm:'Olá {nome}, sua consulta foi confirmada para {data} às {hora}.',msgRemind:'Olá {nome}, lembrete: consulta amanhã {data} às {hora}.',msgCancel:'Olá {nome}, sua consulta de {data} às {hora} foi cancelada.'};
  S.bookingLinks=LS('bookingLinks')||[];
}
function saveState(){LSS('patients',S.patients);LSS('appointments',S.appointments);LSS('settings',S.settings);LSS('bookingLinks',S.bookingLinks);}

// ==============================
// HELPERS
// ==============================
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36);
const today=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())};
const fmtDate=d=>d.toLocaleDateString('pt-BR');
const fmtTime=d=>d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
const weekStart=(offset=0)=>{const d=new Date();d.setDate(d.getDate()+d.getDay()*0+d.getDay());d.setDate(d.getDate()-d.getDay()+1+offset*7);return d};
const addDays=(d,n)=>{const r=new Date(d);r.setDate(r.getDate()+n);return r};
const sameDay=(a,b)=>a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const toast=(msg,type='ok')=>{const t=document.createElement('div');t.className='toast '+type;t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),3000)};
const weekDays=()=>{const s=weekStart(curWeek);return Array.from({length:5},(_,i)=>{const d=addDays(s,i);return{date:d,label:d.toLocaleDateString('pt-BR',{weekday:'short'})+' '+d.getDate(),full:d.toLocaleDateString('pt-BR')}})}; 

function monthLabel(offset){
  const s=weekStart(offset);const e=addDays(s,4);
  const same=s.getMonth()===e.getMonth()&&s.getFullYear()===e.getFullYear();
  if(same)return s.toLocaleDateString('pt-BR',{month:'long'})+' '+s.getFullYear();
  return s.toLocaleDateString('pt-BR',{month:'short'})+' '+s.getFullYear()+' - '+e.toLocaleDateString('pt-BR',{month:'short'});
}

function patientName(id){const p=S.patients.find(x=>x.id===id);return p?p.name:'Paciente removido'}

function timeToMinutes(t){const[m]=t.split(':').map(Number);return m}

function getApptsForDay(d){return S.appointments.filter(a=>{const ad=new Date(a.date);return sameDay(ad,d)&&a.status!=='cancelled'})}

// ==============================
// WHATSAPP & GCAL
// ==============================
function waLink(phone,msg){const p=phone.replace(/\D/g,'');return p?`https://wa.me/55${p}?text=${encodeURIComponent(msg)}`:''}

function gcalLink(title,dateStr,timeStr,desc){
  const d=new Date(dateStr);const[t]=timeStr.split(':').map(Number);
  d.setHours(t,0,0,0);const end=new Date(d);end.setMinutes(d.getMinutes()+S.settings.duration);
  const fmt=d=>d.toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';
  return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(title)}&dates=${fmt(d)}/${fmt(end)}&details=${encodeURIComponent(desc||'')}`;
}

// ==============================
// NAVIGATION
// ==============================
const TABS=[
  {id:'agenda',icon:'📅',label:'Agenda'},
  {id:'patients',icon:'👥',label:'Pacientes'},
  {id:'sessions',icon:'📋',label:'Sessões'},
  {id:'finance',icon:'💰',label:'Financeiro'},
  {id:'booklinks',icon:'🔗',label:'Links'},
  {id:'settings',icon:'⚙️',label:'Config'},
];

function renderNav(){
  const nav=document.getElementById('nav');
  nav.innerHTML=TABS.map(t=>`<div class="nav-i${curTab===t.id?' act':''}" onclick="switchTab('${t.id}')"><span class="ni-ic">${t.icon}</span><span>${t.label}</span></div>`).join('');
}

function switchTab(tab){
  curTab=tab;renderNav();renderTab();closeSidebar();
}

function renderTab(){
  const mh=document.getElementById('mh');
  const tab=TABS.find(t=>t.id===curTab);
  document.getElementById('mhTitle').textContent=tab.label;
  document.getElementById('mhActions').innerHTML='';
  const c=document.getElementById('content');
  if(curTab==='agenda')renderAgenda(c);
  else if(curTab==='patients')renderPatients(c);
  else if(curTab==='sessions')renderSessions(c);
  else if(curTab==='finance')renderFinance(c);
  else if(curTab==='booklinks')renderBookLinks(c);
  else if(curTab==='settings')renderSettings(c);
}

// ==============================
// AGENDA
// ==============================
function renderAgenda(c){
  const days=weekDays();
  c.innerHTML=`
<div class="ag-header">
  <h3>${monthLabel(curWeek)}</h3>
  <div class="ag-nav">
    <button class="btn-icon" onclick="curWeek--;renderTab()">◀</button>
    <button class="btn-icon" onclick="curWeek=0;renderTab()">📅</button>
    <button class="btn-icon" onclick="curWeek++;renderTab()">▶</button>
  </div>
</div>
<div class="pill-group">
  <div class="pill act">Semanal</div>
</div>
<div class="ag-grid">
  <div></div>
  ${days.map(d=>`<div class="ag-col${sameDay(d.date,today())?' h':''}" data-day="${d.date.toISOString()}"><div style="text-align:center;padding:6px 0;font-size:11px;font-weight:600;color:${sameDay(d.date,today())?'var(--accent)':'var(--text2)'}">${d.label.split(' ')[0]}<br>${d.label.split(' ')[1]}</div></div>`).join('')}
  ${(()=>{
    const slots=[];
    for(let h=7;h<=20;h++){
      slots.push(`<div class="ag-time">${String(h).padStart(2,'0')}:00</div>`);
      for(let d=0;d<5;d++){
        const day=addDays(weekStart(curWeek),d);
        const apps=getApptsForDay(day).filter(a=>{const ah=timeToMinutes(a.time);return ah===h});
        const empty=apps.length===0;
        slots.push(`<div class="ag-col" style="min-height:40px">${empty?'<div class="ag-empty">--</div>':apps.map(a=>{
          const p=patientName(a.patientId);
          return `<div class="ag-slot ${a.status}" onclick="openApptModal('${a.id}')" data-id="${a.id}"><div class="name">${esc(p)}</div><div class="time">${a.time}</div></div>`;
        }).join('')}</div>`);
      }
    }
    return slots.join('');
  })()}
</div>
<div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">
  <button class="primary sm" onclick="openNewApptModal()">+ Nova Consulta</button>
</div>`;

  // Make empty slots clickable
  document.querySelectorAll('.ag-empty').forEach(el=>{
    const col=el.closest('.ag-col');
    const dayI=Array.from(col.parentElement.children).indexOf(col);
    const day=addDays(weekStart(curWeek),(dayI-1)%5);
    el.style.cursor='pointer';
    el.onclick=()=>openQuickBook(day);
  });
}

function openQuickBook(day){
  const m=document.getElementById('modal');
  const pOpts=S.patients.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');
  m.innerHTML=`
<div class="modal-h"><h3>Nova Consulta — ${fmtDate(day)}</h3><button class="btn-icon" onclick="closeModal()">✕</button></div>
<div class="form-g">
  <label>Paciente</label>
  <select id="qbP">${pOpts||'<option value="">Nenhum paciente cadastrado</option>'}</select>
</div>
<div class="form-row">
  <div class="form-g"><label>Horário</label><input type="time" id="qbT" value="08:00"></div>
  <div class="form-g"><label>Status</label>
    <select id="qbS"><option value="confirmed">Confirmada</option><option value="pending">Pendente</option></select>
  </div>
</div>
<div class="form-actions">
  <button class="btn-ghost" onclick="closeModal()">Cancelar</button>
  <button class="primary" onclick="quickBookSave()">Agendar</button>
</div>`;
  document.getElementById('modalO').classList.add('show');

  S.patients=S.patients.filter(x=>x.id!==id);

function exportCSV(){
  let csv='Data,Hora,Paciente,Status,Valor\n';
  S.appointments.sort((a,b)=>new Date(a.date)-new Date(b.date)).forEach(a=>{
    const p=patientName(a.patientId);
    csv+=`${a.date},${a.time},${p},${a.status},${a.payment==='paid'?S.settings.sessionValue:0}\n`;
  });
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='psi-financeiro.csv';a.click();
  toast('CSV exportado');
}

function saveSettings(){
  S.settings.name=document.getElementById('sName').value.trim()||'Dr(a)';
  S.settings.whatsapp=document.getElementById('sWA').value.trim();
  S.settings.sessionValue=parseFloat(document.getElementById('sVal').value)||150;
  S.settings.duration=parseInt(document.getElementById('sDur').value)||50;

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>PsiGestão 🏳️‍🌈</title>
<style>
:root{
  --bg:#000;
  --bg2:#111;
  --bg3:#1a1a1a;
  --bg4:#2a2a2a;
  --text:#f0f0f0;
  --text2:#999;
  --accent:#ff6b9d;
  --accent2:#e85d8f;
  --green:#22C55E;
  --red:#EF4444;
  --amber:#F59E0B;
  --blue:#3B82F6;
  --radius:12px;
  --r2:8px;
  --shadow:0 4px 24px rgba(0,0,0,.5);
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --aside:230px;
  --head:56px;
  --rg:linear-gradient(90deg,#FF0000,#FF7F00,#FFFF00,#00FF00,#0000FF,#8B00FF);
  --rg2:linear-gradient(135deg,#FF0000,#FF7F00,#FFFF00,#00FF00,#0000FF,#8B00FF);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;overflow:hidden}
button{cursor:pointer;font-family:var(--font);border:none;background:none;color:inherit}
input,textarea,select{font-family:var(--font);font-size:14px;background:var(--bg3);border:1px solid var(--bg4);color:var(--text);border-radius:var(--r2);padding:10px 14px;outline:none;width:100%;transition:border .2s}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:60px}
select{appearance:auto}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}

/* Rainbow decorators */
.star{display:inline-block;background:var(--rg);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-right:4px}
.glow{text-shadow:0 0 20px rgba(255,107,157,.3)}

/* Buttons */
button.primary{background:var(--rg);color:#fff;padding:10px 20px;border-radius:var(--r2);font-weight:600;transition:opacity .2s;background-size:200% 100%}
button.primary:hover{opacity:.85}
button.sm{padding:6px 12px;font-size:13px}
button.outline{background:transparent;border:1px solid var(--bg4);color:var(--text2);padding:8px 16px;border-radius:var(--r2);transition:.2s}
button.outline:hover{border-color:var(--accent);color:var(--text)}
.btn-icon{width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;border-radius:var(--r2);transition:.15s;font-size:18px}
.btn-icon:hover{background:var(--bg3)}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600}
.badge-green{background:rgba(34,197,94,.15);color:var(--green)}
.badge-red{background:rgba(239,68,68,.15);color:var(--red)}
.badge-amber{background:rgba(245,158,11,.15);color:var(--amber)}
.badge-blue{background:rgba(59,130,246,.15);color:var(--blue)}
.badge-gray{background:rgba(153,153,153,.15);color:var(--text2)}

/* Login */
#login{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:#000}
.login-b{background:var(--bg2);padding:40px;border-radius:var(--radius);box-shadow:var(--shadow);width:360px;max-width:90vw;text-align:center;border:1px solid var(--bg3)}
.login-b .star-logo{font-size:64px;background:var(--rg);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px;display:block}
.login-b h1{font-size:26px;margin-bottom:2px;font-weight:800}
.login-b h1 span{background:var(--rg);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.login-b p{color:var(--text2);font-size:13px;margin-bottom:24px}
.login-b input{padding:12px 16px;font-size:16px;margin-bottom:8px}
.login-b button{width:100%;padding:12px;margin-top:4px;background:var(--rg);background-size:200% 100%;color:#fff;border:none;border-radius:var(--r2);font-size:16px;font-weight:600}
.login-b button:hover{opacity:.85}
.login-e{color:var(--red);font-size:13px;margin-top:8px;display:none}

/* Layout */
#app{display:flex;height:100vh;display:none}
.aside{width:var(--aside);background:var(--bg2);display:flex;flex-direction:column;border-right:1px solid var(--bg3);flex-shrink:0}
.brand{padding:16px 20px;font-size:15px;font-weight:700;border-bottom:2px solid;border-image:var(--rg) 1;display:flex;align-items:center;gap:8px}
.brand .star-icon{font-size:18px;background:var(--rg);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.brand span{background:var(--rg);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.nav{flex:1;padding:8px;overflow-y:auto}
.nav-i{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:var(--r2);color:var(--text2);font-size:13px;font-weight:500;transition:.15s;cursor:pointer;width:100%;text-align:left}
.nav-i:hover{background:var(--bg3);color:var(--text)}
.nav-i.act{background:var(--rg);color:#fff;font-weight:600;background-size:200% 100%}
.ni-ic{font-size:15px;width:20px;text-align:center}
.aside-f{padding:12px 16px;border-top:1px solid var(--bg3)}
.aside-f button{width:100%;padding:8px;border:1px solid var(--bg3);color:var(--text2);border-radius:var(--r2);font-size:12px;transition:.2s}
.aside-f button:hover{border-color:var(--red);color:var(--red)}

/* Main */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.mh{height:var(--head);display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:2px solid;border-image:var(--rg) 1;flex-shrink:0}
.mh h2{font-size:17px;font-weight:700}
.mh h2 .star-mini{background:var(--rg);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-size:14px;margin-right:4px}
.mh-actions{display:flex;gap:8px;align-items:center}
#content{flex:1;overflow-y:auto;padding:20px 24px}
#content::-webkit-scrollbar{width:6px}
#content::-webkit-scrollbar-track{background:transparent}
#content::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:3px}

/* Cards */
.card{background:var(--bg2);border-radius:var(--radius);padding:16px;margin-bottom:12px;border:1px solid var(--bg3)}
.card-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.card-h h3{font-size:15px;font-weight:600}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px}
.stat-c{background:var(--bg2);border-radius:var(--radius);padding:16px;border:1px solid var(--bg3);text-align:center}
.stat-v{font-size:28px;font-weight:700;margin-top:4px}
.stat-l{color:var(--text2);font-size:12px;text-transform:uppercase;letter-spacing:.5px}

/* Dashboard */
.db-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.db-card{background:var(--bg2);border:1px solid var(--bg3);border-radius:var(--radius);padding:16px}
.db-card h4{font-size:13px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;font-weight:500}
.db-card .db-val{font-size:22px;font-weight:700}
.db-card .db-sub{font-size:12px;color:var(--text2);margin-top:4px}
.insight-card{background:linear-gradient(135deg,var(--bg2),var(--bg3));border:1px solid var(--accent);border-radius:var(--radius);padding:14px;margin-bottom:8px;font-size:13px;display:flex;align-items:center;gap:10px}
.insight-card .icn{font-size:20px;flex-shrink:0}
.insight-card .txt{flex:1}
.insight-card .txt strong{color:var(--accent)}

/* Table */
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:10px 12px;color:var(--text2);font-weight:500;border-bottom:1px solid var(--bg3);font-size:12px;text-transform:uppercase;letter-spacing:.5px}
td{padding:10px 12px;border-bottom:1px solid var(--bg3)}
tr:hover td{background:var(--bg3)}

/* Agenda grid */
.ag-grid{display:grid;grid-template-columns:70px repeat(5,1fr);gap:2px;min-height:600px}
.ag-time{display:flex;align-items:start;justify-content:center;padding-top:4px;font-size:11px;color:var(--text2);position:relative}
.ag-time::after{content:'';position:absolute;top:50%;left:70px;right:0;height:1px;background:var(--bg3);pointer-events:none}
.ag-col{min-height:40px;position:relative;background:var(--bg2);border-radius:4px}
.ag-col.h{background:var(--bg3)}
.ag-slot{position:absolute;left:2px;right:2px;border-radius:6px;padding:4px 6px;font-size:11px;overflow:hidden;cursor:pointer;transition:.15s;border:1px solid transparent}
.ag-slot:hover{border-color:var(--accent);transform:scale(1.02);z-index:2}
.ag-slot.confirmed{background:rgba(34,197,94,.2);color:var(--green)}
.ag-slot.cancelled{background:rgba(239,68,68,.15);color:var(--red)}
.ag-slot.pending{background:rgba(245,158,11,.15);color:var(--amber)}
.ag-slot .name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ag-slot .time{opacity:.7}
.ag-empty{display:flex;align-items:center;justify-content:center;height:100%;color:var(--text2);font-size:11px}
.ag-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.ag-nav{display:flex;gap:6px;align-items:center}

/* Modal */
.modal-o{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center}
.modal-o.show{display:flex}
.modal{background:var(--bg2);border-radius:var(--radius);padding:24px;width:560px;max-width:95vw;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow);border:1px solid var(--bg3)}
.modal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.modal-h h3{font-size:17px;font-weight:600}
.form-g{margin-bottom:14px}
.form-g label{display:block;font-size:13px;color:var(--text2);margin-bottom:4px;font-weight:500}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;padding-top:12px;border-top:1px solid var(--bg3)}
.btn-ghost{color:var(--text2);padding:8px 16px;border-radius:var(--r2);transition:.15s}
.btn-ghost:hover{background:var(--bg3);color:var(--text)}

/* Search */
.search-b{display:flex;gap:8px;margin-bottom:12px}
.search-b input{flex:1}

/* Searchable patient select */
.sp-wrap{position:relative}
.sp-input{width:100%;padding:10px 14px;background:var(--bg3);border:1px solid var(--bg4);color:var(--text);border-radius:var(--r2);font-size:14px;outline:none;transition:border .2s}
.sp-input:focus{border-color:var(--accent)}
.sp-list{position:absolute;top:100%;left:0;right:0;max-height:220px;overflow-y:auto;background:var(--bg2);border:1px solid var(--bg4);border-radius:0 0 var(--r2) var(--r2);z-index:100;display:none;box-shadow:var(--shadow)}
.sp-list.show{display:block}
.sp-item{padding:10px 14px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--bg3);transition:.1s}
.sp-item:hover,.sp-item.hl{background:var(--bg4);color:var(--accent)}
.sp-item:last-child{border:none}
.sp-item .sp-phone{font-size:11px;color:var(--text2);margin-left:8px}
.sp-empty{padding:14px;text-align:center;color:var(--text2);font-size:13px}

/* Sub tabs */
.sub-tabs{display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--bg3);padding-bottom:4px}
.sub-tab{padding:8px 16px;font-size:13px;color:var(--text2);border-radius:var(--r2) var(--r2) 0 0;transition:.15s;cursor:pointer}
.sub-tab:hover{color:var(--text);background:var(--bg3)}
.sub-tab.act{color:var(--text);background:var(--bg3);font-weight:600}

/* Pill tabs */
.pill-group{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px}
.pill{padding:6px 14px;border-radius:99px;font-size:12px;background:var(--bg3);color:var(--text2);cursor:pointer;transition:.15s}
.pill.act{background:var(--accent);color:#fff}
.pill:hover{background:var(--bg4)}

/* Booking link card */
.bl-card{background:var(--bg2);border:1px solid var(--bg3);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.bl-card .bl-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.bl-card .bl-h h4{font-size:15px}
.bl-card .bl-url{background:var(--bg3);padding:8px 12px;border-radius:var(--r2);font-size:12px;color:var(--text2);word-break:break-all;margin:8px 0;display:flex;align-items:center;gap:8px}
.bl-card .bl-url code{flex:1;font-size:12px}
.bl-tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;margin-right:4px;background:var(--bg4)}

/* Hamburger */
.hamb{display:none;width:36px;height:36px;align-items:center;justify-content:center;border-radius:var(--r2);font-size:22px;cursor:pointer;transition:.15s;flex-shrink:0}
.hamb:hover{background:var(--bg3)}
.sb-overlay{position:fixed;inset:0;z-index:89;background:rgba(0,0,0,.6);display:none}

/* Template items */
.temp-list{display:grid;gap:6px;margin-bottom:12px}
.temp-item{padding:8px 12px;background:var(--bg3);border-radius:var(--r2);cursor:pointer;font-size:13px;transition:.15s}
.temp-item:hover{background:var(--bg4);color:var(--accent)}

/* Settings groups */
.set-g{margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid var(--bg3)}
.set-g:last-child{border-bottom:none;margin-bottom:0}
.set-g h4{font-size:14px;font-weight:600;margin-bottom:8px;color:var(--text);display:flex;align-items:center;gap:6px}
.set-g .hint{font-size:12px;color:var(--text2);margin-top:4px}

/* Toast */
.toast{position:fixed;bottom:24px;right:24px;background:var(--bg2);border:1px solid var(--bg3);border-radius:var(--radius);padding:12px 20px;box-shadow:var(--shadow);z-index:200;animation:slideIn .3s;font-size:14px;max-width:360px;border-left:3px solid var(--green)}
.toast.err{border-left-color:var(--red)}
.toast.warn{border-left-color:var(--amber)}
@keyframes slideIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

/* Patient card */
.pc{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--bg3);cursor:pointer;transition:.1s}
.pc:hover{background:var(--bg3);margin:0 -12px;padding:10px 12px;border-radius:var(--r2)}
.pc:last-child{border:none}
.pc-av{width:40px;height:40px;border-radius:50%;background:var(--rg2);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;color:#fff;font-weight:700}
.pc-info{flex:1;min-width:0}
.pc-info .name{font-weight:600;font-size:14px}
.pc-info .meta{font-size:12px;color:var(--text2)}
.pc-actions{display:flex;gap:4px;flex-shrink:0}

/* Evolução timeline */
.tl-item{padding:12px;border-left:2px solid #ff6b9d;margin-left:8px;margin-bottom:12px;position:relative}
.tl-item::before{content:'';position:absolute;left:-6px;top:16px;width:10px;height:10px;border-radius:50%;background:var(--rg2)}
.tl-item .tl-date{font-size:11px;color:var(--text2);margin-bottom:4px}
.tl-item .tl-text{font-size:13px;line-height:1.5}

/* Notas */
.note-card{background:var(--bg3);border-radius:var(--r2);padding:12px;margin-bottom:8px;cursor:pointer;transition:.15s}
.note-card:hover{border-color:var(--accent)}
.note-card .note-date{font-size:11px;color:var(--text2);margin-bottom:4px}
.note-card .note-text{font-size:13px;white-space:pre-wrap;word-break:break-word}

/* Mural */
.mural-item{display:flex;align-items:center;gap:12px;padding:12px;background:var(--bg3);border-radius:var(--r2);margin-bottom:8px;transition:.15s;cursor:pointer}
.mural-item:hover{border:1px solid var(--accent);padding:11px}
.mural-item .m-icon{font-size:20px;flex-shrink:0}
.mural-item .m-info{flex:1}
.mural-item .m-title{font-weight:600;font-size:13px}
.mural-item .m-desc{font-size:12px;color:var(--text2)}

/* Honorários */
.recibo-box{background:var(--bg3);border-radius:var(--r2);padding:16px;margin-bottom:8px}
.recibo-box .rec-linha{display:flex;justify-content:space-between;padding:4px 0;font-size:13px}
.recibo-box .rec-total{font-weight:700;background:var(--rg);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-size:16px;padding-top:8px;border-top:1px solid var(--bg4);margin-top:8px}

/* Pattern analysis */
.pattern-card{background:var(--bg3);border-radius:var(--r2);padding:12px;margin-bottom:8px;display:flex;align-items:center;gap:10px}
.pattern-card .p-day{font-weight:700;background:var(--rg);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-size:16px;width:36px;text-align:center;flex-shrink:0}
.pattern-card .p-info{flex:1}
.pattern-card .p-info .p-name{font-weight:600;font-size:13px}
.pattern-card .p-info .p-detail{font-size:12px;color:var(--text2)}
.pattern-card .p-pct{font-size:20px;font-weight:700;color:var(--green);flex-shrink:0}

/* WhatsApp and GCal colors */
.whatsapp{color:#25D366}
.whatsapp:hover{background:rgba(37,211,102,.1)}
.gcal{color:#4285F4}
.gcal:hover{background:rgba(66,133,244,.1)}

/* Status colors */
.text-green{color:var(--green)}
.text-red{color:var(--red)}
.text-amber{color:var(--amber)}
.text-accent{color:var(--accent)}

/* Print recibo */
@media print{body *{visibility:hidden}#reciboPrint,#reciboPrint *{visibility:visible}#reciboPrint{position:fixed;top:0;left:0;width:100%;padding:40px;background:#fff;color:#000;font-size:14px}}

/* Horários sugeridos */
.sug-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin-bottom:12px}
.sug-card{background:var(--bg3);border:1px solid var(--bg4);border-radius:var(--r2);padding:12px;text-align:center}
.sug-card .sug-dia{font-weight:700;background:var(--rg);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-size:14px}
.sug-card .sug-hora{font-size:12px;color:var(--text2);margin:4px 0}
.sug-card .sug-pct{font-size:24px;font-weight:700;color:var(--green)}
.sug-card .sug-label{font-size:11px;color:var(--text2)}
.sug-card.sug-high{border-color:#ff6b9d;background:linear-gradient(135deg,var(--bg3),rgba(255,107,157,.1))}

/* Quick actions */
.qactions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.qactions button{display:flex;align-items:center;gap:6px;padding:10px 16px;background:var(--bg3);border:1px solid var(--bg4);border-radius:var(--r2);font-size:13px;transition:.15s}
.qactions button:hover{border-color:var(--accent);background:var(--bg4)}

/* Responsive */
@media(max-width:768px){
  .hamb{display:flex}
  .aside{position:fixed;top:0;left:0;bottom:0;z-index:90;width:280px;transform:translateX(-100%);transition:transform .25s;box-shadow:var(--shadow)}
  .aside.open{transform:translateX(0)}
  .sb-overlay.show{display:block}
  .ag-grid{grid-template-columns:50px repeat(5,1fr);font-size:10px}
  .mh h2{font-size:15px}
  .form-row{grid-template-columns:1fr}
  .stat-grid{grid-template-columns:repeat(2,1fr)}
  .db-grid{grid-template-columns:1fr}
  .sug-grid{grid-template-columns:1fr 1fr}
  #content{padding:12px}
  .mh{padding:0 12px}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <div class="login-b">
    <div class="star-logo">★</div>
    <h1>★ Psi<span>Gestão</span></h1>
    <p>🏳️‍🌈 Gestão inteligente para psicólogos</p>
    <input type="password" id="pw" placeholder="Senha" autocomplete="off" onkeydown="if(event.key==='Enter')tryLogin()">
    <button onclick="tryLogin()">Entrar</button>
    <div class="login-e" id="loginE">Senha incorreta</div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <aside class="aside" id="aside">
    <div class="brand"><span class="star-icon">★</span>Psi<span>Gestão</span></div>
    <nav class="nav" id="nav"></nav>
    <div class="aside-f"><button onclick="logout()">🚪 <span>Sair</span></button></div>
  </aside>
  <div class="sb-overlay" id="sbOverlay" onclick="closeSidebar()"></div>
  <div class="main">
    <div class="mh"><button class="hamb" id="hamb" onclick="toggleSidebar()">☰</button><h2 id="mhTitle">Dashboard</h2><div class="mh-actions" id="mhActions"></div></div>
    <div id="content"></div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-o" id="modalO"><div class="modal" id="modal"></div></div>

<div id="reciboPrint" style="display:none"></div>

<script>
// ==============================
// STATE
// ==============================
const S={patients:[],appointments:[],settings:{},bookingLinks:[],notes:[],muralItems:[]};
let curTab='dashboard',curWeek=0;

// ─── API Layer ──────────────────────────
const API_BASE='/api';
function getToken(){return sessionStorage.getItem('bf_token')}
function setToken(t){if(t)sessionStorage.setItem('bf_token',t);else sessionStorage.removeItem('bf_token')}
async function apiPost(path,body){
  const headers={'Content-Type':'application/json'};
  const tok=getToken();if(tok)headers['X-Auth-Token']=tok;
  const r=await fetch(API_BASE+path,{method:'POST',headers,body:JSON.stringify(body)});
  if(!r.ok){const e=await r.json().catch(()=>({error:'Request failed'}));throw new Error(e.error||'Request failed')}
  return r.json()
}
async function apiGet(path){
  const headers={};
  const tok=getToken();if(tok)headers['X-Auth-Token']=tok;
  const r=await fetch(API_BASE+path,{headers});
  if(!r.ok){const e=await r.json().catch(()=>({error:'Request failed'}));throw new Error(e.error||'Request failed')}
  return r.json()
}

async function loadState(){
  try{
    const d=await apiGet('/data');
    if(d.patients)S.patients=d.patients;
    if(d.appointments)S.appointments=d.appointments;
    if(d.settings)S.settings=d.settings;else S.settings={sessionValue:150,duration:50,name:'Dr(a)',whatsapp:'',crp:'',endereco:'',telefone:'',pix:'',notify:true,msgConfirm:'Olá {nome}! Sua consulta foi confirmada para {data} às {hora}. Estarei esperando por você. ★',msgRemind:'Olá {nome}! Lembrete: amanhã temos consulta às {hora}. Confirme sua presença! ★',msgCancel:'Olá {nome}! Sua consulta de {data} às {hora} precisou ser cancelada. Me avise se quiser reagendar. ★',videoLink:'https://meet.google.com/'};
    if(d.bookingLinks)S.bookingLinks=d.bookingLinks;
    if(d.notes)S.notes=d.notes;
    if(d.muralItems)S.muralItems=d.muralItems;
  }catch(e){
    console.error('loadState:',e);
    S.settings={sessionValue:150,duration:50,name:'Dr(a)',whatsapp:'',crp:'',endereco:'',telefone:'',pix:'',notify:true,msgConfirm:'',msgRemind:'',msgCancel:'',videoLink:''};
    S.muralItems=getDefaultMural();
  }
}

function saveState(){
  const tok=getToken();
  if(!tok)return;
  fetch(API_BASE+'/data',{
    method:'POST',
    headers:{'Content-Type':'application/json','X-Auth-Token':tok},
    body:JSON.stringify({
      patients:S.patients,appointments:S.appointments,settings:S.settings,
      bookingLinks:S.bookingLinks,notes:S.notes,muralItems:S.muralItems
    })
  }).catch(e=>{console.error('saveState:',e);toast('Erro ao salvar','err')});
}

const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36);
const today=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())};
const fmtDate=d=>d.toLocaleDateString('pt-BR');
const fmtDateTime=d=>d.toLocaleDateString('pt-BR')+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
const fmtTime=d=>d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
const weekStart=(offset=0)=>{const d=new Date();d.setDate(d.getDate()-d.getDay()+1+offset*7);d.setHours(0,0,0,0);return d};
const addDays=(d,n)=>{const r=new Date(d);r.setDate(r.getDate()+n);return r};
const sameDay=(a,b)=>a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const toast=(msg,type='ok')=>{const t=document.createElement('div');t.className='toast '+(type==='err'?'err':type==='warn'?'warn':'ok');t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),3000)};
const weekDays=(offset=0)=>{const s=weekStart(offset);return Array.from({length:5},(_,i)=>{const d=addDays(s,i);return{date:d,label:d.toLocaleDateString('pt-BR',{weekday:'short'}).slice(0,3)+' '+d.getDate(),full:d.toLocaleDateString('pt-BR')}})};

function monthLabel(offset){
  const s=weekStart(offset);const e=addDays(s,4);
  const same=s.getMonth()===e.getMonth()&&s.getFullYear()===e.getFullYear();
  if(same)return s.toLocaleDateString('pt-BR',{month:'long'})+' '+s.getFullYear();
  return s.toLocaleDateString('pt-BR',{month:'short'})+' - '+e.toLocaleDateString('pt-BR',{month:'short'})+' '+e.getFullYear();
}

function patientName(id){const p=S.patients.find(x=>x.id===id);return p?p.name:'Paciente removido'}
const patientValue=id=>{const p=S.patients.find(x=>x.id===id);return p&&p.sessionValue?parseFloat(p.sessionValue):null}
function getApptValue(a){
  if(a.value!==undefined&&a.value!==null&&a.value!=='')return parseFloat(a.value);
  const pv=patientValue(a.patientId);
  if(pv!==null)return pv;
  return S.settings.sessionValue;
}
function getApptsForDay(d){return S.appointments.filter(a=>{const ad=new Date(a.date);return sameDay(ad,d)&&a.status!=='cancelled'})}

// _spVal[id] stores selected patientId for each searchable select instance
const _spVal={};
let _spFocus=null;

function buildSP(containerId, selectedId=''){
  const c=document.getElementById(containerId);
  const cid=containerId+'_val';
  _spVal[cid]=selectedId;
  const defLabel=selectedId?esc(S.patients.find(x=>x.id===selectedId)?.name||''):'';
  c.innerHTML=`<div class="sp-wrap">
    <input class="sp-input" id="${containerId}_inp" placeholder="Digite para buscar paciente..." value="${defLabel}"
      autocomplete="off" oninput="filterSP(this,'${containerId}_list','${cid}')" onfocus="filterSP(this,'${containerId}_list','${cid}')" onkeydown="spKeyDown(event,'${containerId}_list','${containerId}_inp','${cid}')">
    <div class="sp-list" id="${containerId}_list"></div>
  </div>`;
  filterSP(document.getElementById(containerId+'_inp'),containerId+'_list',cid);
}

function filterSP(inp,listId,cid){
  const q=inp.value.trim().toLowerCase();
  const list=document.getElementById(listId);
  const filtered=S.patients.filter(p=>!q||p.name.toLowerCase().includes(q));
  list.innerHTML=filtered.length?filtered.map((p,i)=>`<div class="sp-item${i===0?' hl':''}" data-id="${p.id}" onclick="pickSP('${p.id}','${listId}','${cid}')" onmouseenter="spHover(this,'${listId}')">${esc(p.name)}${p.phone?' <span class="sp-phone">📱'+esc(p.phone)+'</span>':''}</div>`).join(''):'<div class="sp-empty">Nenhum paciente encontrado</div>';
  list.classList.add('show');
  _spFocus=listId;
}

function spKeyDown(e,listId,inpId,cid){
  const list=document.getElementById(listId);
  const items=list.querySelectorAll('.sp-item');
  if(!items.length||!list.classList.contains('show'))return;
  let idx=Array.from(items).findIndex(x=>x.classList.contains('hl'));
  if(e.key==='ArrowDown'){e.preventDefault();idx=Math.min(idx+1,items.length-1)}
  else if(e.key==='ArrowUp'){e.preventDefault();idx=Math.max(idx-1,0)}
  else if(e.key==='Enter'){e.preventDefault();if(idx>=0){items[idx].click()};return}
  else if(e.key==='Escape'){e.preventDefault();list.classList.remove('show');return}
  else return;
  items.forEach(x=>x.classList.remove('hl'));
  items[idx].classList.add('hl');
  items[idx].scrollIntoView({block:'nearest'});
}

function spHover(el,listId){
  document.querySelectorAll(`#${listId} .sp-item`).forEach(x=>x.classList.remove('hl'));
  el.classList.add('hl');
}

function pickSP(pid,listId,cid){
  const p=S.patients.find(x=>x.id===pid);
  _spVal[cid]=pid;
  const wrap=document.getElementById(listId).closest('.sp-wrap');
  const inp=wrap.querySelector('.sp-input');
  inp.value=esc(p?p.name:'');
  document.getElementById(listId).classList.remove('show');
}

// Fechar dropdown ao clicar fora
document.addEventListener('click',function(e){
  if(!e.target.closest('.sp-wrap')){
    document.querySelectorAll('.sp-list.show').forEach(x=>x.classList.remove('show'));
  }
});

function waLink(phone,msg){
  if(!phone)return '';
  const p=phone.replace(/\D/g,'');
  return p?`https://wa.me/55${p}?text=${encodeURIComponent(msg)}`:'';
}

function waLinkPatient(phone,msg){
  return waLink(phone,msg);
}

function gcalLink(title,dateStr,timeStr,desc,dur){
  const d=new Date(dateStr);
  const [h,m]=timeStr.split(':').map(Number);
  d.setHours(h,m||0,0,0);
  const end=new Date(d);
  end.setMinutes(d.getMinutes()+(dur||50));
  const fmt=d=>d.toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';
  return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(title)}&dates=${fmt(d)}/${fmt(end)}&details=${encodeURIComponent(desc||'')}`;
}

function sendWhatsApp(phone,msg){
  const link=waLink(phone,msg);
  if(!link){toast('Paciente sem WhatsApp cadastrado','err');return}
  window.open(link,'_blank');
}

function sendWAMessage(pid,type){
  const p=S.patients.find(x=>x.id===pid);
  if(!p||!p.phone){toast('Paciente sem WhatsApp','err');return}
  const apps=S.appointments.filter(a=>a.patientId===pid).sort((a,b)=>new Date(b.date)-new Date(a.date));
  const last=apps[0];
  let msg;
  if(type==='confirm'&&last){
    msg=S.settings.msgConfirm.replace('{nome}',p.name).replace('{data}',fmtDate(new Date(last.date))).replace('{hora}',last.time);
  }else if(type==='remind'&&last){
    msg=S.settings.msgRemind.replace('{nome}',p.name).replace('{data}',fmtDate(new Date(last.date))).replace('{hora}',last.time);
  }else{
    msg='Olá '+p.name+'! Tudo bem?';
  }
  sendWhatsApp(p.phone,msg);
}

// ==============================
// PATTERN ANALYSIS ENGINE
// ==============================
function analyzePatterns(){
  const patterns=[];
  const diasSem=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];

  // Por paciente: detectar horário preferencial
  S.patients.forEach(p=>{
    const apps=S.appointments.filter(a=>a.patientId===p.id&&a.status!=='cancelled')
      .sort((a,b)=>new Date(a.date)-new Date(b.date));
    if(apps.length<3)return;
    const slots={};
    apps.forEach(a=>{
      const d=new Date(a.date);
      const key=diasSem[d.getDay()]+'_'+a.time;
      slots[key]=(slots[key]||0)+1;
    });
    const best=Object.entries(slots).sort((a,b)=>b[1]-a[1])[0];
    if(best&&best[1]>=3){
      const [dia,hora]=best[0].split('_');
      const total=apps.length;
      const pct=Math.round(best[1]/total*100);
      const firstDate=new Date(apps[0].date);
      const monthsAgo=Math.floor((Date.now()-firstDate.getTime())/(30*24*60*60*1000));
      patterns.push({type:'patient',patientId:p.id,name:p.name,dia,hora,pct,count:best[1],total,months:monthsAgo});
    }
  });

  // Por horário: quais horários mais ocupados
  const hourCount={};
  S.appointments.filter(a=>a.status!=='cancelled').forEach(a=>{
    const d=new Date(a.date);
    const key=diasSem[d.getDay()]+'_'+a.time;
    hourCount[key]=(hourCount[key]||0)+1;
  });
  const sortedHours=Object.entries(hourCount).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const peakHours=sortedHours.map(([k,v])=>{
    const [dia,hora]=k.split('_');
    return{dia,hora,count:v};
  });

  // Sugestões de horários livres
  const sugestoes=[];
  const now=new Date();
  for(let w=0;w<4;w++){
    const s=weekStart(w);
    for(let d=0;d<5;d++){
      const day=addDays(s,d);
      if(day<now)continue;
      for(let h=8;h<=18;h+=1){
        const time=String(h).padStart(2,'0')+':00';
        const hasApp=S.appointments.some(a=>{
          const ad=new Date(a.date);
          return sameDay(ad,day)&&a.time===time&&a.status!=='cancelled';
        });
        if(!hasApp){
          sugestoes.push({date:day,time,dia:diasSem[day.getDay()]});
        }
      }
    }
  }

  return {patterns,peakHours,sugestoes};
}

function openQuickBook(day){
  const m=document.getElementById('modal');
  const pOpts=S.patients.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');

    const apps=S.appointments.filter(a=>a.patientId===p.id&&a.status!=='cancelled');
    if(apps.length<2)return '';
    const diasSem=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
    const dName=diasSem[day.getDay()];
    const sameDayApps=apps.filter(a=>{const ad=new Date(a.date);return ad.getDay()===day.getDay()});
    if(sameDayApps.length<2)return '';
    const times={};sameDayApps.forEach(a=>{times[a.time]=(times[a.time]||0)+1});
    const best=Object.entries(times).sort((a,b)=>b[1]-a[1])[0];
    if(best)return `<div style="font-size:12px;color:var(--accent);margin-bottom:8px">★ ${esc(p.name)} costuma agendar ${dName} às ${best[0]}</div>`;
    return '';
  }).filter(Boolean).join('');
  m.innerHTML=`
<div class="modal-h"><h3>Nova Consulta — ${fmtDate(day)}</h3><button class="btn-icon" onclick="closeModal()">✕</button></div>
${patSuggest}
<div class="form-g">
  <label>Paciente</label>
  <div id="qbP"></div>
</div>
<div class="form-row">
  <div class="form-g"><label>Horário</label><input type="time" id="qbT" value="08:00"></div>
  <div class="form-g"><label>Status</label>

  </div>
</div>
<div class="form-actions">
  <button class="btn-ghost" onclick="closeModal()">Cancelar</button>
  <button class="primary" onclick="quickBookSave()">Agendar</button>
</div>`;
  document.getElementById('modalO').classList.add('show');
  window._qbDay=day;
  setTimeout(()=>buildSP('qbP'),10);
}

function saveAppt(id){
  const a=S.appointments.find(x=>x.id===id);
  if(!a)return;
  a.date=document.getElementById('aDate').value;
  a.time=document.getElementById('aTime').value;
  a.status=document.getElementById('aStatus').value;
  a.payment=document.getElementById('aPay').value;
  a.paymentMethod=document.getElementById('aPayMethod').value;
  a.duration=parseInt(document.getElementById('aDur').value)||S.settings.duration;
  a.notes=document.getElementById('aNotes').value;
  const nv=parseFloat(document.getElementById('aVal').value);
  a.value=isNaN(nv)?null:nv;
  saveState();closeModal();toast('Consulta atualizada ★');renderTab();
}

function duplicateAppt(id){
  const a=S.appointments.find(x=>x.id===id);
  if(!a)return;
  const copy={...a,id:uid(),date:today().toISOString().split('T')[0],status:'pending',payment:'pending',paymentMethod:'pix-pos',notes:'',createdAt:new Date().toISOString()};
  S.appointments.push(copy);saveState();toast('Consulta duplicada');closeModal();renderTab();
}

function deleteAppt(id){
  if(!confirm('Excluir esta consulta?'))return;
  S.appointments=S.appointments.filter(x=>x.id!==id);
  saveState();closeModal();toast('Consulta excluida');renderTab();
}

function exportCSV(){
  let csv='Data,Hora,Paciente,Status,Pagamento,Valor,Anotacoes\\n';
  S.appointments.sort((a,b)=>new Date(a.date)-new Date(b.date)).forEach(a=>{
    const p=patientName(a.patientId);
    const v=a.payment==='paid'?getApptValue(a):a.payment==='free'?0:0;
    csv+=`${a.date},${a.time},"${p}",${a.status},${a.payment},${v},"${(a.notes||'').replace(/"/g,'""')}"\\n`;
  });
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const a2=document.createElement('a');a2.href=URL.createObjectURL(blob);a2.download='psi-financeiro.csv';a2.click();
  toast('CSV exportado ★');
}

function renderInsights(c){
  const {patterns,peakHours,sugestoes}=analyzePatterns();
  const now=new Date();const month=now.getMonth();const year=now.getFullYear();
  const monthApps=S.appointments.filter(a=>{const d=new Date(a.date);return d.getMonth()===month&&d.getFullYear()===year});
  const totalMonth=monthApps.length;
  const cancelados=monthApps.filter(a=>a.status==='cancelled').length;
  const txFalta=totalMonth?Math.round(cancelados/totalMonth*100):0;
  const pago=monthApps.filter(a=>a.payment==='paid').reduce((s,a)=>s+getApptValue(a),0);
  const esperado=monthApps.filter(a=>a.status!=='cancelled'&&a.payment!=='free').reduce((s,a)=>s+getApptValue(a),0);
  const txInadimplencia=esperado?Math.round((esperado-pago)/esperado*100):0;
  const horaCount={};
  monthApps.filter(a=>a.status!=='cancelled').forEach(a=>{horaCount[a.time]=(horaCount[a.time]||0)+1});
  const topHoras=Object.entries(horaCount).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const topSugestoes=sugestoes.slice(0,8);
  const faltaRank=[];
  S.patients.forEach(p=>{const apps=S.appointments.filter(a=>a.patientId===p.id);const faltas=apps.filter(a=>a.status==='cancelled').length;if(faltas>0)faltaRank.push({name:p.name,faltas,total:apps.length,pct:Math.round(faltas/apps.length*100)})});
  faltaRank.sort((a,b)=>b.pct-a.pct);
  const comRetorno=S.patients.filter(p=>{const apps=S.appointments.filter(a=>a.patientId===p.id);return apps.length>=2}).length;
  const txRetencao=S.patients.length?Math.round(comRetorno/S.patients.length*100):0;
  c.innerHTML=`<div class="stat-grid"><div class="stat-c"><div class="stat-l">Sessoes/mes</div><div class="stat-v">${totalMonth}</div></div><div class="stat-c"><div class="stat-l">Taxa de falta</div><div class="stat-v" style="color:${txFalta>20?'var(--red)':txFalta>10?'var(--amber)':'var(--green)'}">${txFalta}%</div></div><div class="stat-c"><div class="stat-l">Retencao</div><div class="stat-v" style="color:${txRetencao>70?'var(--green)':'var(--amber)'}">${txRetencao}%</div></div><div class="stat-c"><div class="stat-l">Inadimplencia</div><div class="stat-v" style="color:${txInadimplencia>20?'var(--red)':txInadimplencia>10?'var(--amber)':'var(--green)'}">${txInadimplencia}%</div></div></div>${patterns.length?'<div class="card"><div class="card-h"><h3>★ Pacientes com padrao</h3></div>'+patterns.map(p=>'<div class="pattern-card"><div class="p-day">'+p.dia.slice(0,3)+'</div><div class="p-info"><div class="p-name">'+esc(p.name)+'</div><div class="p-detail">'+p.hora+' - '+p.count+' de '+p.total+' sessoes - '+p.months+' meses</div></div><div class="p-pct">'+p.pct+'%</div></div>').join('')+'<div style="font-size:12px;color:var(--text2);margin-top:8px">★ Baseado em 3+ sessoes no mesmo horario</div></div>':''}${peakHours.length?'<div class="card"><div class="card-h"><h3>★ Horarios de pico</h3></div>'+peakHours.map(h=>'<div class="pattern-card"><div class="p-day">'+h.dia.slice(0,3)+'</div><div class="p-info"><div class="p-detail">'+h.hora+'</div></div><div class="p-pct">'+h.count+'x</div></div>').join('')+'</div>':''}${topHoras.length?'<div class="card"><div class="card-h"><h3>★ Top horarios</h3></div><div class="sug-grid">'+topHoras.map(([hora,count])=>'<div class="sug-card sug-high"><div class="sug-dia">'+hora+'</div><div class="sug-pct">'+count+'</div><div class="sug-label">sessoes</div></div>').join('')+'</div></div>':''}${topSugestoes.length?'<div class="card"><div class="card-h"><h3>★ Sugestao de horarios livres</h3></div><div class="sug-grid">'+topSugestoes.map(s=>'<div class="sug-card"><div class="sug-dia">'+s.dia.slice(0,3)+'</div><div class="sug-hora">'+fmtDate(s.date)+' '+s.time+'</div><div class="sug-label">Disponivel</div></div>').join('')+'</div></div>':''}${faltaRank.length?'<div class="card"><div class="card-h"><h3>★ Faltas por paciente</h3></div><table><tr><th>Paciente</th><th>Faltas</th><th>Total</th><th>%</th></tr>'+faltaRank.slice(0,5).map(p=>'<tr><td>'+esc(p.name)+'</td><td style="color:var(--red)">'+p.faltas+'</td><td>'+p.total+'</td><td><span class="badge badge-'+(p.pct>30?'red':p.pct>15?'amber':'green')+'">'+p.pct+'%</span></td></tr>').join('')+'</table></div>':''}<div style="font-size:11px;color:var(--text2);text-align:center;padding:12px">★ Dados atualizam automaticamente</div>`;
}

de Agendamento</button></div>`;
}

function openNewBookingLink(){const m=document.getElementById('modal');m.innerHTML=`<div class="modal-h"><h3>Novo Link de Agendamento</h3><button class="btn-icon" onclick="closeModal()">✕</button></div><div class="form-g"><label>Nome do link</label><input id="blName" placeholder="Agendamento Online" value="Agendamento Online"></div><div class="form-row"><div class="form-g"><label>Dias disponiveis</label><div style="display:flex;gap:4px;flex-wrap:wrap">${['Seg','Ter','Qua','Qui','Sex','Sab'].map((d,i)=>'<label style="display:flex;align-items:center;gap:4px;font-size:13px;cursor:pointer;padding:4px 8px;background:var(--bg3);border-radius:var(--r2)"><input type="checkbox" id="blD'+i+'" '+(i<5?'checked':'')+'>'+d+'</label>').join('')}</div></div><div class="form-g"><label>Duracao (min)</label><input type="number" id="blDur" value="${S.settings.duration}" min="30" max="120" step="10"></div></div><div class="form-row"><div class="form-g"><label>Inicio</label><input type="time" id="blStart" value="08:00"></div><div class="form-g"><label>Fim</label><input type="time" id="blEnd" value="18:00"></div></div><div class="form-row"><div class="form-g"><label>Valor (R$)</label><input type="number" id="blPrice" value="${S.settings.sessionValue}" min="0"></div><div class="form-g"><label>Intervalo entre sessoes (min)</label><input type="number" id="blGap" value="10" min="0" max="60"></div></div><div class="form-g"><label>Mensagem de boas-vindas</label><textarea id="blMsg" rows="2">Ola! Escolha o melhor horario para sua consulta. ⚽</textarea></div><div class="form-actions"><button class="btn-ghost" onclick="closeModal()">Cancelar</button><button class="primary" onclick="saveBookingLink()">Criar Link</button></div>`;document.getElementById('modalO').classList.add('show');}
function saveBookingLink(){const days=[];for(let i=0;i<6;i++){const cb=document.getElementById('blD'+i);if(cb&&cb.checked)days.push(['Seg','Ter','Qua','Qui','Sex','Sab'][i])}if(!days.length){toast('Selecione pelo menos um dia','err');return}S.bookingLinks.push({id:uid(),name:document.getElementById('blName').value.trim()||'Link',days,startHour:document.getElementById('blStart').value,endHour:document.getElementById('blEnd').value,duration:parseInt(document.getElementById('blDur').value)||50,price:parseFloat(document.getElementById('blPrice').value)||S.settings.sessionValue,gap:parseInt(document.getElementById('blGap').value)||10,message:document.getElementById('blMsg').value.trim(),active:true,createdAt:new Date().toISOString()});saveState();closeModal();toast('★ Link de agendamento criado!');renderTab();}
function toggleBookingLink(id){const bl=S.bookingLinks.find(x=>x.id===id);if(bl){bl.active=!bl.active;saveState();renderTab();toast(bl.active?'Link ativado':'Link desativado')}}
function deleteBookingLink(id){if(!confirm('Excluir este link permanentemente?'))return;S.bookingLinks=S.bookingLinks.filter(x=>x.id!==id);saveState();toast('Link excluido');renderTab();}
function copyText(t){navigator.clipboard.writeText(t).then(()=>toast('Copiado! ★')).catch(()=>{const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast('Copiado! ★')})}

// ==============================
// MURAL
// ==============================
function renderMural(c){c.innerHTML=`<div class="card-h"><h3>★ Mural de Recursos</h3><button class="primary sm" onclick="openMuralItemModal()">+ Adicionar</button></div><p style="font-size:13px;color:var(--text2);margin-bottom:16px">Links uteis para o dia a dia clinico.</p>${S.muralItems.map(item=>'<div class="mural-item" onclick="'+(item.url&&item.url!=='#'?'window.open(\''+item.url+'\',\'_blank\')':'')+'"><div class="m-icon">'+(item.icon||'📌')+'</div><div class="m-info"><div class="m-title">'+esc(item.title)+'</div><div class="m-desc">'+esc(item.desc)+'</div></div><button class="btn-icon" onclick="event.stopPropagation();deleteMuralItem(\''+item.id+'\')" title="Remover" style="color:var(--text2)">✕</button></div>').join('')}<div style="margin-top:12px"><button class="outline sm" onclick="restoreDefaultMural()">Restaurar padrao</button></div>`;}
function openMuralItemModal(){const m=document.getElementById('modal');m.innerHTML=`<div class="modal-h"><h3>Adicionar ao Mural</h3><button class="btn-icon" onclick="closeModal()">✕</button></div><div class="form-g"><label>Titulo</label><input id="muTitle" placeholder="Nome do recurso"></div><div class="form-g"><label>Descricao</label><input id="muDesc" placeholder="Breve descricao"></div><div class="form-g"><label>URL</label><input id="muUrl" placeholder="https://..."></div><div class="form-g"><label>Icone (emoji)</label><input id="muIcon" placeholder="📋" value="📌" maxlength="2"></div><div class="form-actions"><button class="btn-ghost" onclick="closeModal()">Cancelar</button><button class="primary" onclick="saveMuralItem()">Adicionar</button></div>`;document.getElementById('modalO').classList.add('show');}
function saveMuralItem(){const title=document.getElementById('muTitle').value.trim();if(!title){toast('Titulo e obrigatorio','err');return}S.muralItems.push({id:uid(),title,desc:document.getElementById('muDesc').value.trim(),url:document.getElementById('muUrl').value.trim(),icon:document.getElementById('muIcon').value.trim()||'📌'});saveState();closeModal();toast('Item adicionado ★');renderTab();}
function deleteMuralItem(id){S.muralItems=S.muralItems.filter(x=>x.id!==id);saveState();renderTab()}
function restoreDefaultMural(){if(!confirm('Restaurar o mural padrao? Itens personalizados serao removidos.'))return;S.muralItems=getDefaultMural();saveState();renderTab();toast('Mural restaurado ★');}

// ==============================
// NOTES
// ==============================
function renderNotes(c){const sorted=[...S.notes].sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));c.innerHTML=`<div class="card-h"><h3>★ Bloco de Notas</h3><button class="primary sm" onclick="openNoteModal()">+ Nova nota</button></div>${sorted.length?sorted.map(n=>'<div class="note-card" onclick="openNoteModal(\''+n.id+'\')"><div class="note-date">'+fmtDateTime(new Date(n.createdAt))+'</div><div class="note-text">'+esc(n.text.slice(0,200))+(n.text.length>200?'...':'')+'</div></div>').join(''):'<div style="text-align:center;padding:40px;color:var(--text2)">Nenhuma nota ainda.</div>'}<div style="margin-top:12px"><button class="primary sm" onclick="openNoteModal()">+ Nova Nota</button></div>`;}
function openNoteModal(id){const n=id?S.notes.find(x=>x.id===id):null;const m=document.getElementById('modal');m.innerHTML=`<div class="modal-h"><h3>${n?'Editar':'Nova'} Nota</h3><button class="btn-icon" onclick="closeModal()">✕</button></div><div class="form-g"><textarea id="noteText" rows="8" placeholder="Digite sua nota...">${esc(n?.text||'')}</textarea></div><div class="form-actions"><button class="btn-ghost" onclick="closeModal()">Cancelar</button>${n?'<button class="btn-ghost" onclick="deleteNote(\''+n.id+'\')" style="color:var(--red)">Excluir</button>':''}<button class="primary" onclick="${id?'saveNote(\''+id+'\')':'saveNote()'}">Salvar</button></div>`;document.getElementById('modalO').classList.add('show');}
function saveNote(id){const text=document.getElementById('noteText').value.trim();if(!text){toast('Escreva algo na nota','err');return}if(id){const n=S.notes.find(x=>x.id===id);if(n)n.text=text;n.updatedAt=new Date().toISOString()}else{S.notes.push({id:uid(),text,createdAt:new Date().toISOString()})}saveState();closeModal();toast('Nota salva ★');renderTab();}
function deleteNote(id){if(!confirm('Excluir esta nota?'))return;S.notes=S.notes.filter(x=>x.id!==id);saveState();closeModal();toast('Nota excluida');renderTab();}

// ==============================
// SETTINGS
// ==============================
function renderSettings(c){c.innerHTML=`<div class="card"><div class="set-g"><h4>🏳️‍🌈 Dados do consultorio</h4><div class="form-g"><label>Seu nome</label><input id="sName" value="${esc(S.settings.name)}"></div><div class="form-row"><div class="form-g"><label>CRP</label><input id="sCRP" value="${esc(S.settings.crp||'')}" placeholder="CRP 01/12345"></div><div class="form-g"><label>Telefone</label><input id="sTel" value="${esc(S.settings.telefone||'')}" placeholder="(61) 99999-9999"></div></div><div class="form-g"><label>Endereco do consultorio</label><input id="sEnd" value="${esc(S.settings.endereco||'')}" placeholder="Rua, numero, bairro"></div><div class="form-g"><label>Chave PIX</label><input id="sPix" value="${esc(S.settings.pix||'')}" placeholder="CPF, email ou telefone"></div></div><div class="set-g"><h4>📱 WhatsApp e Teleconsulta</h4><div class="form-g"><label>Seu WhatsApp (para links de agendamento)</label><input id="sWA" value="${esc(S.settings.whatsapp)}" placeholder="61999999999"></div><div class="form-g"><label>Link padrao de teleconsulta</label><input id="sVideo" value="${esc(S.settings.videoLink||'')}" placeholder="https://meet.google.com/"></div></div><div class="set-g"><h4>⚙️ Padroes de consulta</h4><div class="form-row"><div class="form-g"><label>Valor da sessao (R$)</label><input type="number" id="sVal" value="${S.settings.sessionValue}" min="0"></div><div class="form-g"><label>Duracao (min)</label><input type="number" id="sDur" value="${S.settings.duration}" min="30" max="120" step="10"></div></div></div><div class="set-g"><h4>💬 Modelos de mensagem WhatsApp</h4><div class="form-g"><label>Confirmacao</label><textarea id="sMsgC" rows="2">${esc(S.settings.msgConfirm||'')}</textarea><div class="hint">Use {nome}, {data}, {hora}</div></div><div class="form-g"><label>Lembrete</label><textarea id="sMsgR" rows="2">${esc(S.settings.msgRemind||'')}</textarea><div class="hint">Use {nome}, {data}, {hora}</div></div><div class="form-g"><label>Cancelamento</label><textarea id="sMsgX" rows="2">${esc(S.settings.msgCancel||'')}</textarea><div class="hint">Use {nome}, {data}, {hora}</div></div></div><button class="primary" onclick="saveSettings()">★ Salvar Configuracoes</button></div>`;}
function saveSettings(){S.settings.name=document.getElementById('sName').value.trim()||'Dr(a)';S.settings.whatsapp=document.getElementById('sWA').value.trim();S.settings.crp=document.getElementById('sCRP').value.trim();S.settings.telefone=document.getElementById('sTel').value.trim();S.settings.endereco=document.getElementById('sEnd').value.trim();S.settings.pix=document.getElementById('sPix').value.trim();S.settings.videoLink=document.getElementById('sVideo').value.trim();S.settings.sessionValue=parseFloat(document.getElementById('sVal').value)||150;S.settings.duration=parseInt(document.getElementById('sDur').value)||50;S.settings.msgConfirm=document.getElementById('sMsgC').value.trim();S.settings.msgRemind=document.getElementById('sMsgR').value.trim();S.settings.msgCancel=document.getElementById('sMsgX').value.trim();saveState();toast('🏳️‍🌈 Configuracoes salvas!');}

// ==============================
// SIDEBAR & MODAL
// ==============================
function toggleSidebar(){document.getElementById('aside').classList.toggle('open');document.getElementById('sbOverlay').classList.toggle('show')}
function closeSidebar(){document.getElementById('aside').classList.remove('open');document.getElementById('sbOverlay').classList.remove('show')}

// ==============================
// LOGIN
// ==============================
async function tryLogin(){
  const pw=document.getElementById('pw').value;
  try{
    const r=await apiPost('/auth/login',{password:pw});
    if(r.ok&&r.token){
      setToken(r.token);
      await loadState();
      sessionStorage.setItem('bf_logged','1');
      document.getElementById('login').style.display='none';
      document.getElementById('app').style.display='flex';
      renderNav();renderTab();
    }else{document.getElementById('loginE').style.display='block'}
  }catch(e){document.getElementById('loginE').style.display='block';document.getElementById('pw').value=''}
}
function logout(){
  setToken(null);
  sessionStorage.removeItem('bf_logged');
  document.getElementById('app').style.display='none';
  document.getElementById('login').style.display='flex';
  document.getElementById('pw').value='';
  document.getElementById('loginE').style.display='none'
}

// ==============================
// INIT
// ==============================
// Async init - wait for loadState if logged in
(async()=>{
  if(sessionStorage.getItem('bf_logged')&&getToken()){
    try{
      await loadState();
      renderNav();renderTab();
      document.getElementById('login').style.display='none';
      document.getElementById('app').style.display='flex';
    }catch(e){
      console.error('init error:',e);
      renderNav();
    }
  }else{
    renderNav();
  }
})();
</script>
